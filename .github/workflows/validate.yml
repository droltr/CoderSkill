name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate shell scripts
        run: bash -n scripts/build-adapters scripts/doctor scripts/security-audit scripts/validate-*
      - name: Validate adapters
        run: scripts/build-adapters --check
      - name: Validate project profile and lesson examples
        run: |
          scripts/validate-project-profile .coderskill/project.yml.example
          scripts/validate-lesson knowledge/lesson.example.yml
      - name: Check patch formatting
        run: git diff --check
